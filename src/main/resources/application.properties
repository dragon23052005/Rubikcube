spring.application.name=Speedcube Academy
logging.config=classpath:logback-spring.xml
spring.config.import=optional:file:./config/database-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/demotesting?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.whitelabel.enabled=false
server.error.include-message=never
server.port=${PORT:8080}

server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Social sign-in stays disabled until the corresponding app credentials are supplied.
academy.oauth.base-url=${APP_BASE_URL:http://localhost:8080}
academy.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
academy.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
academy.oauth.facebook.client-id=${FACEBOOK_CLIENT_ID:}
academy.oauth.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
# Copy the supported version shown in your Meta App dashboard (for example vNN.0).
academy.oauth.facebook.graph-version=${FACEBOOK_GRAPH_VERSION:}
