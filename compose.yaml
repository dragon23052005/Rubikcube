services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: demotesting
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports: ["3306:3306"]
    volumes: ["academy-mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  academy-mysql-data:
